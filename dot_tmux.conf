# Enable scrolling, selection, and pane resizing with the mouse.
set -g mouse on

# Keep enough scrollback for long-running commands and logs.
set -g history-limit 100000

# Let terminal applications react when the terminal gains or loses focus.
set -g focus-events on

# Copy through the outer terminal when it advertises clipboard support.
set -g set-clipboard on

# Keep Escape responsive in editors while allowing terminal key sequences.
set -sg escape-time 10
